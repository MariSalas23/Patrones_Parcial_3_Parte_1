version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: postgres-parcial

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-parcial

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      - postgres

  nginx:
    image: nginx:latest
    container_name: nginx-parcial

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - postgres
  
  kong:
    image: kong:3.7

    container_name: kong-parcial

    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml

    ports:
      - "8000:8000"

    volumes:
      - ./kong/kong.yml:/usr/local/kong/declarative/kong.yml

    depends_on:
      - nginx