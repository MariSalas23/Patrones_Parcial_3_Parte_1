spring.application.name=pago-service
server.port=8080

aldeamo.url=http://localhost:8081
twilio.url=http://localhost:8082

spring.datasource.url=jdbc:postgresql://localhost:5432/pagos_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

resilience4j.circuitbreaker.instances.smsCircuit.sliding-window-size=6
resilience4j.circuitbreaker.instances.smsCircuit.minimum-number-of-calls=6
resilience4j.circuitbreaker.instances.smsCircuit.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.smsCircuit.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.smsCircuit.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.smsCircuit.automatic-transition-from-open-to-half-open-enabled=true